<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3 · Planificateur VLSM — TSSR</title><style>body{font:16px system-ui;background:#edf3f8;color:#183047;margin:0}header{background:#126b79;color:white;padding:24px}main{max-width:1050px;margin:25px auto;padding:0 16px}.panel{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 2px 9px #cbd6dd}input,select,button{padding:9px;border:1px solid #b5c7d1;border-radius:7px;font:inherit}button{cursor:pointer;background:#126b79;color:white}button:hover{background:#0b5260}label{display:inline-block;margin:8px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #dde5ea;padding:10px;text-align:left}.bits{display:flex;gap:2px;flex-wrap:wrap}.bit{width:24px;height:30px;padding:0;border-radius:3px;font:14px monospace}.net{background:#2563a6}.host{background:#c84b50}.muted{color:#60717b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.tag{padding:4px 8px;border-radius:6px;background:#e0f2f3}.error{color:#b42318}.step{border-left:4px solid #126b79;padding:10px;margin:8px 0;background:#f0f7f8}code{word-break:break-word}footer{margin:30px 0;color:#60717b;text-align:center}</style></head><body><header><h1>3 · Planificateur VLSM</h1><div>Boîte à outils TSSR · autonome · fonctionne sans Internet</div></header><main><div class="panel"><h2>Réseau de départ</h2><label>Réseau <input id="network" value="192.168.10.0"></label><label>Préfixe / <input id="prefix" type="number" min="0" max="32" value="24" style="width:70px"></label><p class="muted">Un réseau parent doit être aligné sur son préfixe.</p><h2>Besoins en hôtes (un nombre par ligne)</h2><textarea id="needs" rows="6" style="width:95%;font:inherit;padding:10px">50

5</textarea><p><button id="calc">Calculer les sous-réseaux</button></p><p id="err" class="error"></p></div><div class="panel"><h2>Plan d'adressage VLSM</h2><div style="overflow:auto"><table id="out"></table></div><p id="info"></p></div></main><footer>Outil pédagogique TSSR · les résultats sont calculés localement dans le navigateur.</footer><script>const $=id=>document.getElementById(id);const ipParse=s=>{let a=s.trim().split('.');if(a.length!==4||!a.every(x=>/^\d{1,3}$/.test(x)&&+x<=255))return null;return a.reduce((v,x)=>((v<<8)|+x)>>>0,0)};const fmt=n=>[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.');const mask=p=>p===0?0:(0xffffffff<<(32-p))>>>0;const binary=n=>[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].map(x=>x.toString(2).padStart(8,'0')).join('.');$('calc').onclick=()=>{let n=ipParse($('network').value),p=Number($('prefix').value),lines=$('needs').value.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean),needs=lines.map(Number),err='';if(n===null||!Number.isInteger(p)||p<0||p>32)err='Réseau ou préfixe invalide.';else if(((n&mask(p))>>>0)!==n)err='Adresse du réseau parent non alignée : utiliser '+fmt((n&mask(p))>>>0)+'/'+p+'.';else if(!lines.length||needs.some(x=>!Number.isSafeInteger(x)||x<1))err='Saisir un nombre entier positif d’hôtes par ligne.';if(err){$('err').textContent=err;$('out').innerHTML='';return}let parentSize=2**(32-p),end=n+parentSize,cur=n,rows=[],sorted=needs.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);for(let o of sorted){let bits=Math.ceil(Math.log2(o.v+2)),size=2**bits,sub=32-bits;if(size>2**32){err='Demande trop grande.';break}cur=Math.ceil(cur/size)*size;if(cur+size>end){err='Espace insuffisant pour tous les sous-réseaux.';break}rows.push([o.i+1,o.v,fmt(cur>>>0)+'/'+sub,fmt((cur+1)>>>0),fmt((cur+size-2)>>>0),fmt((cur+size-1)>>>0),size-2]);cur+=size} $('err').textContent=err;$('out').innerHTML=err?'':'<tr><th>Besoin n°</th><th>Hôtes</th><th>Réseau</th><th>1er hôte</th><th>Dernier hôte</th><th>Broadcast</th><th>Capacité</th></tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('');$('info').textContent=err?'':'Adresses non attribuées (dont espaces d’alignement) : '+(parentSize-rows.reduce((s,r)=>s+(r[6]+2),0)).toLocaleString('fr-FR')};$('calc').click();</script></body></html>
