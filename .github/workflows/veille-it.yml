name: Veille IT - journal Pause Cafe
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_veille.py
      - name: Publier le journal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/veille-it.js
          if ! git diff --cached --quiet; then
            git commit -m 'Mise a jour automatique de la veille IT'
            git push
          fi
