name: Construire Linux Operator (v86 + Alpine Bash)
on:
  workflow_dispatch:
  push:
    paths:
      - 'linux-operator/index.html'
      - 'linux-operator/app.js'
      - 'linux-operator/style.css'
      - 'linux-operator/linux/**'
      - 'linux-operator/build/build-all.sh'
      - 'linux-operator/vendor/**'
      - '.github/workflows/linux-operator.yml'
permissions:
  contents: write
jobs:
  construire:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Préparer Rust / wasm32
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Dépendances compilateur
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make
          python -m pip install zstandard
      - name: Construire Linux et l'émulateur
        run: bash linux-operator/build/build-all.sh
      - name: Publier les fichiers binaires dans ce dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f linux-operator/assets
          if ! git diff --cached --quiet; then
            git commit -m "Construire Linux Operator OS [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Les binaires sont déjà à jour."
          fi
